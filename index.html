<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101119">
<title>GRP1 개발 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 첫 화면: 전체 일정(주인공) → 게임 보드. 공용 토큰·타임라인 CSS 는 hub.js 가 넣는다. */
body{background:var(--stage,#101119)}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--gutter) 64px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px;padding:40px 0 30px}
.brand{margin:0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.025em}
.top p{margin:0 0 3px;color:var(--ink-3);font-size:13px;white-space:nowrap}
.top p b{color:var(--ink);font-weight:600;font-size:15px;margin-right:10px}
section{margin-top:44px}
section:first-of-type{margin-top:0}
h2{margin:0 0 14px;font-size:18px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
h2 .n{margin-left:7px;color:var(--ink-3);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.sched .panel{padding:12px 20px 6px}

/* 게임 보드: 넓은 화면 3열 — 큰 날짜가 여유 있게 들어가는 폭 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:border-color .2s}
.card:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.card-head{display:flex;align-items:center;gap:14px;padding:18px 20px 16px}
.card-head .nm{display:block;font:600 21px/1.15 var(--game);letter-spacing:.005em}
.status{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:500}
.card-part{padding:14px 20px;border-top:1px solid var(--line)}
.part-label{margin:0 0 8px;color:var(--ink-3);font-size:12px}
/* 주요 날짜(마일스톤): 카드에서 가장 크게 보이는 정보. 이름 앞 마름모는 전체 일정의 마름모와 같은 모양 */
.keydates{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:18px 20px;padding-top:18px;padding-bottom:18px}
.kd-name{display:flex;align-items:center;gap:9px;color:var(--ink-2);font-size:13px;font-weight:500}
.kd-name::before{content:"";flex:none;width:10px;height:10px;margin-left:2px;box-sizing:border-box;border:2.5px solid var(--c);border-radius:2px;background:var(--ink);transform:rotate(45deg)}
.kd-date{display:block;margin-top:7px;font:700 36px/1 var(--game);color:var(--ink);letter-spacing:-.015em;white-space:nowrap}
.kd-date small{margin-left:7px;font:500 14px/1 var(--kr);color:var(--ink-3);letter-spacing:0}
.kd-left{display:inline-block;margin-top:10px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 20%,transparent);color:color-mix(in srgb,var(--c) 55%,var(--ink));font:600 13.5px/1.45 var(--game)}
.kd.next .kd-left{background:var(--c);color:var(--on-color)}
.kd.past .kd-name,.kd.past .kd-date{color:var(--ink-3)}
.kd.past .kd-name::before{opacity:.5}
.kd.past .kd-left{background:var(--surface-2);color:var(--ink-3)}
a.keydates{transition:background .15s}
a.keydates:hover{background:rgba(255,255,255,.02)}
.phase{margin-top:0;display:flex;justify-content:space-between;gap:10px;color:var(--ink-2);font-size:12.5px}
.phase i{font-style:normal;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prog{height:4px;margin-top:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;border-radius:inherit;background:var(--c)}
.none{margin:0;color:var(--ink-3);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;transition:color .15s,background .15s}
.chip:hover{color:var(--ink);background:#2b2f42}
.chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chip.fresh{box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.recent{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.recent a,.recent .row{display:grid;grid-template-columns:8px 78px 1fr;align-items:baseline;gap:8px;padding:3px 0;font-size:12.5px;border-radius:6px}
.recent .gone{color:var(--ink-3)}
.recent a:hover .t{text-decoration:underline;text-underline-offset:3px}
.recent .when{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12px}
.recent .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .v{color:var(--ink-3);margin-left:5px;font-size:11.5px}
.dot{width:7px;height:7px;border-radius:50%;align-self:center;box-shadow:inset 0 0 0 1px var(--ink-3)}
.dot.on{background:var(--accent);box-shadow:none}
.empty{padding:40px 0;color:var(--ink-3);text-align:center}

@media (max-width:640px){
  .top{padding:24px 0 20px}
  .brand{font-size:24px}
  .top p b{font-size:14px}
  section{margin-top:36px}
  h2{font-size:17px}
  .sched .panel{padding:8px 10px 2px}
  .card-head,.card-part{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div id="gate"></div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <h1 class="brand">GRP1 개발 허브</h1>
    <p><b id="today"></b> <span id="built"></span></p>
  </header>
  <section class="sched" id="sched" hidden>
    <h2>전체 일정</h2>
    <div class="panel"><div id="timeline"></div></div>
  </section>
  <section>
    <h2>게임<span class="n" id="game-count"></span></h2>
    <div class="cards" id="cards"></div>
  </section>
</div>
<script src="hub.js"></script>
<script>
(function () {
  'use strict';
  var H = window.HUB, $ = function (id) { return document.getElementById(id); }, esc = H.escape;

  H.gate({ title: 'GRP1 개발 허브', onOpen: function (m) {
    Promise.all(m.games.map(function (g) { return H.iconColor(g.icon, g.slug); })).then(function (colors) { render(m, colors); });
  } });

  function render(m, colors) {
    var today = H.todayKST(), now = Date.now();
    var color = {}, docs = {};
    m.games.forEach(function (g, i) {
      color[g.slug] = colors[i];
      g.categories.forEach(function (c) { c.docs.forEach(function (d) { docs[g.slug + '\n' + d.id] = { category: c.name, title: d.title, removed: d.removed }; }); });
    });
    $('today').textContent = H.todayLabel(now);
    $('built').textContent = m.built ? H.ago(m.built, now) + ' 업데이트' : '';
    $('app').hidden = false;

    // 삭제된 게임(폴더가 사라짐)은 첫 화면에서 뺀다(이전 판 링크는 계속 열린다). 순서는 런칭이 가까운 게임부터.
    var live = H.byLaunch(m.games.filter(function (g) { return !g.removed; }), today);

    // 전체 일정
    var rows = live.map(function (g) {
      return { label: H.iconHtml(g, 30, color[g.slug]) + '<span>' + esc(g.name) + '</span>', color: color[g.slug],
        items: g.schedule ? g.schedule.items : [], href: H.gameLink(g.slug, '일정') };
    });
    if (rows.some(function (r) { return r.items.length; })) {
      $('sched').hidden = false;
      H.timeline($('timeline'), rows, today, { compact: true, labelWidth: window.innerWidth < 640 ? 140 : 220 });
    }

    // 게임 보드
    $('game-count').textContent = live.length ? String(live.length) : '';
    $('cards').innerHTML = live.length ? live.map(function (g) { return card(g, m.history, color[g.slug], today, now, docs); }).join('')
      : '<p class="empty">아직 올라온 게임이 없습니다.</p>';
  }

  function card(g, history, c, today, now, docs) {
    var items = g.schedule ? g.schedule.items : [];
    var ms = H.milestones(items, today), ph = H.currentPhase(items, today);
    var html = '<article class="card" style="--c:' + c + '">' +
      '<a class="card-head" href="' + H.gameLink(g.slug) + '">' + H.iconHtml(g, 48, c) +
      '<span><span class="nm">' + esc(g.name) + '</span><span class="status">' + esc(H.statusLabel(g.status)) + '</span></span></a>';

    // 개발 완료·런칭 같은 마일스톤 날짜를 크게. 가장 가까운 것은 D-day 를 게임 색으로 채우고, 지난 것은 흐리게 D+n.
    if (ms.length) {
      var next = ms.filter(function (m) { return m.days >= 0; })[0];
      html += '<a class="card-part keydates" href="' + H.gameLink(g.slug, '일정') + '">' + ms.map(function (m) {
        return '<span class="kd' + (m.days < 0 ? ' past' : m === next ? ' next' : '') + '"><span class="kd-name">' + esc(m.title) + '</span>' +
          '<span class="kd-date">' + H.md(m.date) + '<small>' + m.weekday + '</small></span>' +
          '<span class="kd-left">' + H.ddayText(m.days) + '</span></span>';
      }).join('') + '</a>';
    }
    if (ph) {
      html += '<div class="card-part"><div class="phase"><span>지금 ' + esc(ph.title) + '</span><i>' + ph.day + ' / ' + ph.len + '일</i></div>' +
        '<div class="prog"><span style="width:' + (ph.day / ph.len * 100).toFixed(1) + '%"></span></div></div>';
    }

    var cats = g.categories.map(function (cat) {
      var live = cat.docs.filter(function (d) { return !d.removed; });
      if (!live.length) return '';
      var fresh = live.some(function (d) { return H.isFresh(d.versions[d.versions.length - 1].ts, now); });
      return '<a class="chip' + (fresh ? ' fresh' : '') + '" href="' + H.gameLink(g.slug, cat.name) + '">' + esc(cat.name) + '<b>' + live.length + '</b></a>';
    }).join('');
    if (cats) html += '<div class="card-part"><p class="part-label">문서</p><div class="chips">' + cats + '</div></div>';

    var mine = history.filter(function (h) { return h.slug === g.slug; }).slice(0, 3);
    if (mine.length) {
      html += '<div class="card-part"><p class="part-label">최근 변경</p><ul class="recent">' + mine.map(function (h) {
        var d = docs[h.slug + '\n' + h.id];
        var dot = '<i class="dot' + (H.isFresh(h.ts, now) ? ' on' : '') + '"></i><span class="when">' + H.stamp(h.ts) + '</span>';
        if (h.note === '삭제됨') return '<li><span class="row">' + dot + '<span class="t gone">' + esc(d ? d.title : h.id) + '<span class="v">삭제됨</span></span></span></li>';
        var label = h.kind === 'schedule' ? '일정 갱신' : esc(d ? d.title : h.id) + '<span class="v">v' + h.v + '</span>';
        var href = h.kind === 'schedule' ? H.gameLink(g.slug, '일정') : d ? H.docLink(g.slug, d.category, h.id, h.v) : H.gameLink(g.slug);
        return '<li><a href="' + href + '"><i class="dot' + (H.isFresh(h.ts, now) ? ' on' : '') + '"></i><span class="when">' + H.stamp(h.ts) + '</span><span class="t">' + label + '</span></a></li>';
      }).join('') + '</ul></div>';
    }
    if (!items.length && !cats && !mine.length) html += '<div class="card-part"><p class="none">아직 올라온 문서가 없습니다.</p></div>';
    return html + '</article>';
  }
})();
</script>
</body>
</html>
